name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, such as v0.9
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Check that the tag matches versionName
        id: version
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Decode the keystore
        env:
          S200_KEYSTORE_BASE64: ${{ secrets.S200_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$S200_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "S200_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build the signed APK
        env:
          S200_STORE_PASSWORD: ${{ secrets.S200_STORE_PASSWORD }}
          S200_KEY_ALIAS: ${{ secrets.S200_KEY_ALIAS }}
          S200_KEY_PASSWORD: ${{ secrets.S200_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Verify the signature and name the APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk="xiaomi-ble-scale-bridge-$VERSION.apk"
          mv app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee apksigner.txt
          cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apksigner.txt)
          [ -n "$cert" ]
          sha256sum "$apk" > "$apk.sha256"
          {
            echo "APK SHA-256: \`$(cut -d' ' -f1 "$apk.sha256")\`"
            echo
            echo "Signing certificate SHA-256: \`$cert\`"
          } > notes.md
          echo "file=$apk" >> "$GITHUB_OUTPUT"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.file }}
        run: gh release create "$TAG" "$APK" "$APK.sha256" --verify-tag --title "$TAG" --notes-file notes.md --generate-notes
